name: Build Android Proxy Library

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/main.yml"
  pull_request:
    branches: [main]
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # 产物统一放这个目录
  OUT_DIR: proxy

jobs:
  build-android:
    name: Build Android .so (arm64 + arm32)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: |
            aarch64-linux-android
            armv7-linux-androideabi

      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27
          add-to-path: false

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~/.cargo/bin/
            target/
          key: ${{ runner.os }}-cargo-android-${{ hashFiles('Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-android-

      # 缓存命中时 ~/.cargo/bin/cargo-ndk 已存在，
      # 此时 cargo install 会报 "binary already exists"（exit 101），故先探测
      - name: Install cargo-ndk
        run: |
          if command -v cargo-ndk >/dev/null 2>&1; then
            echo "cargo-ndk 已存在（缓存命中）: $(cargo-ndk --version)"
          else
            cargo install cargo-ndk --locked
          fi

      - name: Run unit tests (host)
        run: cargo test --lib -- --test-threads=1

      - name: Build for Android (arm64-v8a + armeabi-v7a)
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cargo ndk -t arm64-v8a -t armeabi-v7a \
            -o ./jniLibs build --release --lib

      # cargo-ndk 产出 jniLibs/<abi>/libproxy.so，
      # 这里摊平成带架构后缀的名字，方便直接用 raw URL 分发
      - name: Collect artifacts into ${{ env.OUT_DIR }}/
        run: |
          set -e
          mkdir -p "$OUT_DIR"
          cp jniLibs/arm64-v8a/libproxy.so   "$OUT_DIR/android-arm64.so"
          cp jniLibs/armeabi-v7a/libproxy.so "$OUT_DIR/android-arm.so"
          ls -l "$OUT_DIR"

      - name: Verify exported JNI symbols
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          set -e
          NM=$(find "$ANDROID_NDK_HOME" -name 'llvm-nm' | head -n1)
          for so in "$OUT_DIR"/android-arm64.so "$OUT_DIR"/android-arm.so; do
            echo "== $so =="
            for sym in startProxy stopProxy isProxyRunning getLastError; do
              full="Java_com_github_catvod_spider_GoProxyLibrary_$sym"
              if "$NM" -D --defined-only "$so" | grep -q " $full$"; then
                echo "OK   $full"
              else
                echo "FAIL 缺少导出符号 $full"
                exit 1
              fi
            done
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-proxy-libs
          path: ${{ env.OUT_DIR }}/*.so
          retention-days: 30
          if-no-files-found: error

      # 回提到仓库 proxy/ 目录，便于直接用 raw / CDN 地址分发。
      # 上面的 paths 过滤器不含 proxy/**，所以这次提交不会再触发本工作流。
      - name: Commit .so back to ${{ env.OUT_DIR }}/
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          set -e
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "$OUT_DIR"/android-arm64.so "$OUT_DIR"/android-arm.so
          if git diff --cached --quiet; then
            echo "产物无变化，跳过提交"
          else
            git commit -m "chore(proxy): update android .so [skip ci]"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.OUT_DIR }}/*.so
