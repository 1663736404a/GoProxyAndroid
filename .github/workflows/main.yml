name: Build Rust Multi-Platform Library

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
  pull_request:
    branches: [main]
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # ==================== Android ====================
  build-android:
    name: Build Android .so
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: |
            aarch64-linux-android
            armv7-linux-androideabi

      - name: Install Android NDK
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27
          add-to-path: false

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-android-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-android-

      - name: Build for Android (all architectures)
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          cargo ndk -t arm64-v8a -t armeabi-v7a \
            -o ./jniLibs build --release

      - name: Upload .so artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-libs
          path: jniLibs/
          retention-days: 30

  # ==================== Linux ====================
  build-linux:
    name: Build Linux .so
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-linux-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-linux-

      - name: Build for Linux
        run: cargo build --release --target x86_64-unknown-linux-gnu

      - name: Upload .so artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-libs
          path: target/x86_64-unknown-linux-gnu/release/*.so
          retention-days: 30

  # ==================== macOS ====================
  build-macos:
    name: Build macOS .dylib
    strategy:
      matrix:
        target:
          - x86_64-apple-darwin
          - aarch64-apple-darwin
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-macos-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-macos-${{ matrix.target }}-

      - name: Build for macOS
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload .dylib artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-libs-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/*.dylib
          retention-days: 30

  # ==================== Windows ====================
  build-windows:
    name: Build Windows .dll
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
          key: ${{ runner.os }}-cargo-windows-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-windows-

      - name: Build for Windows
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Upload .dll artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-libs
          path: target/x86_64-pc-windows-msvc/release/*.dll
          retention-days: 30

  # ==================== Release ====================
  release:
    name: Upload to GitHub Release
    needs: [build-android, build-linux, build-macos, build-windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package artifacts
        run: |
          cd artifacts
          for dir in */; do
            name="${dir%/}"
            zip -r "../${name}.zip" "$dir"
          done

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: "*.zip"
