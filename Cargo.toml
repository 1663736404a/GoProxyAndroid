[package]
name = "proxy"
version = "0.1.0"
edition = "2021"
description = "Rust local video proxy for CatVod (Android JNI shared library)"
license = "MIT"

# 产物名 libproxy.so，由 CI 摊平重命名为 proxy-android-{arm64,arm}.so
[lib]
name = "proxy"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

# 独立运行模式，PC 上调试用
[[bin]]
name = "proxy-standalone"
path = "src/main.rs"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
bytes = "1"
async-stream = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
jni = "0.21"

[profile.release]
opt-level = "z"       # 优先压体积
lto = true            # 全程序优化
strip = true          # 去符号
codegen-units = 1
# 故意不启用 panic = "abort"：
# 这个 .so 加载进播放器宿主进程，abort 会连带杀掉整个 App。
# 保留 unwind 后，单个请求 panic 只会变成 JoinError → 返回 500。
